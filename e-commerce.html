<title>Static E-Commerce Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#2874F0;
    color:white;
    text-align:center;
    padding:20px;
    font-size:32px;
    font-weight:bold;
}

/* Grid Layout */
.container{
    display:grid;
    grid-template-rows:repeat(5,auto);
    gap:25px;
    padding:20px;
}

/* Category */
.category{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 3px 8px rgba(0,0,0,0.2);
}

.category h2{
    margin-bottom:15px;
    color:#2874F0;
}

/* Flex Layout */
.products{
    display:flex;
    justify-content:space-evenly;
    flex-wrap:wrap;
    gap:15px;
}

.card{
    width:180px;
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:8px;
    text-align:center;
    padding:10px;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
    box-shadow:0 5px 10px rgba(0,0,0,0.3);
}

.card img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:5px;
}

.card h3{
    margin-top:10px;
    font-size:18px;
}
</style>

</head>
